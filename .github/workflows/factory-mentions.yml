# Based on Factory-AI/droid-action v10 native @droid command mode.
name: Factory Mentions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: factory-mentions-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      vars.JHD_FACTORY_MENTIONS_ENABLED == 'true' &&
      github.actor == (github.event.comment.user.login || github.event.review.user.login) &&
      ((github.event.sender.type == 'User' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association || github.event.review.author_association)) ||
       (github.event.sender.type == 'Bot' &&
        github.event.sender.login == 'factory-droid[bot]')) &&
      ((github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@droid')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@droid')) ||
       (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@droid')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Authorize actor and reject fork pull requests
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const actors = new Set([context.actor, process.env.TRIGGERING_ACTOR]);
            for (const actor of actors) {
              if (actor === 'factory-droid[bot]') continue;
              if (actor.endsWith('[bot]')) {
                core.setFailed('Only factory-droid is an allowed Factory bot.');
                return;
              }
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: actor,
              });
              if (!['admin', 'write'].includes(data.permission)) {
                core.setFailed('Factory mentions require a repository writer.');
                return;
              }
            }
            const issue = context.payload.issue;
            const number = issue?.number || context.payload.pull_request.number;
            if (issue && !issue.pull_request) {
              if (issue.state !== 'open') return;
            } else {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              if (pr.state !== 'open' ||
                  pr.head.repo?.full_name !== `${owner}/${repo}`) {
                core.info('Factory mentions do not run on fork or closed PRs.');
                return;
              }
            }
            core.setOutput('eligible', 'true');

  mentions:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Require Factory API key
        shell: bash
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          if [[ -z "$FACTORY_API_KEY" ]]; then
            echo "::error::FACTORY_API_KEY is required when Factory mentions are enabled."
            exit 1
          fi

      - name: Check out trusted default branch without saved credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # Only comments/reviews authorize a native @droid command. Issue titles,
      # bodies, diffs, and logs are untrusted context, never shell input.
      - name: Run native Droid mention handler
        uses: Factory-AI/droid-action@ec767fcf5fac43b64e746cd42bb398b3b0b529ed # v10
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          allowed_bots: factory-droid
          review_depth: deep
          security_block_on_critical: "false"
          security_block_on_high: "false"
          show_full_output: "false"
