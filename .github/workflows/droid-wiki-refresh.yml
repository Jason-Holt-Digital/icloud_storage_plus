name: Droid Wiki Refresh

# Monthly, not on every push to main: each run is a paid Droid session, and
# a monthly incremental refresh keeps the wiki current enough. Run it by hand
# from the Actions tab when the wiki needs refreshing sooner.
on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch:

# The job that runs /wiki is read-only: the agent reads the whole repository
# and the pages restored from the unmerged rolling branch, so it must not be
# able to push or to open pull requests. The wiki-publish job below carries
# the write permissions.
permissions:
  contents: read

# One refresh at a time for the whole repository: the wiki is per repo, so
# the group must not vary by branch or run. A manual run started during a
# scheduled one waits instead of starting a parallel full generation.
concurrency:
  group: droid-wiki-refresh
  cancel-in-progress: false

env:
  # Rolling branch that carries the generated wiki from one run to the
  # next. A fixed name, so the next run can find it.
  WIKI_BRANCH: factory/droid-wiki

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: /wiki diffs against the commit the previous wiki
          # was generated from to update only the affected pages.
          fetch-depth: 0

      - name: Restore the previous wiki from the rolling branch
        # Copies only droid-wiki/ into the working tree, without switching
        # branches, so /wiki finds its previous wiki on disk. On the first
        # run the branch does not exist yet and /wiki generates the whole wiki.
        run: |
          if git fetch origin "$WIKI_BRANCH" 2>/dev/null && git checkout FETCH_HEAD -- droid-wiki; then
            echo "Restored droid-wiki/ from $WIKI_BRANCH; the wiki refresh updates only the pages whose code changed."
          else
            echo "No previous wiki on $WIKI_BRANCH; this run generates the whole wiki."
          fi

      - name: Install Factory Droid
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Generate wiki
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Hand the wiki to the publish job
        # Branch runs only: a pull_request run checks out a merge commit that
        # the pull request action cannot work from, and its wiki would
        # describe unmerged code. The hosted wiki still refreshes on such runs.
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        uses: actions/upload-artifact@v4
        with:
          name: droid-wiki
          # The pages and their metadata only: the video overview and the
          # screenshots stay out of git. The hidden .wiki-meta.json is what
          # makes the next refresh incremental.
          path: |
            droid-wiki
            !droid-wiki/video/**
            !droid-wiki/images/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  wiki-publish:
    needs: wiki-refresh
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN is read-only by default. This job pushes the
    # rolling branch and opens the pull request with it when no
    # FACTORY_WIKI_PR_TOKEN secret is set.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick up the generated wiki
        uses: actions/download-artifact@v4
        with:
          name: droid-wiki
          path: droid-wiki

      - name: Open or update the wiki pull request
        id: wiki-pr
        # The wiki is already generated (and uploaded when wiki cloud sync is
        # on) by this point, so a rejected push or pull request must not fail
        # the run; the next step turns it into a run annotation instead.
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # FACTORY_WIKI_PR_TOKEN: contents: write and pull-requests: write
          # on this repository, nothing else. Pull requests opened with the
          # GITHUB_TOKEN fallback do not trigger other workflows, so required
          # checks will not run on the wiki pull request.
          token: ${{ secrets.FACTORY_WIKI_PR_TOKEN || github.token }}
          branch: ${{ env.WIKI_BRANCH }}
          # One pull request against one base, whichever branch the run was
          # for; the action rebases the wiki commit onto it.
          base: ${{ github.event.repository.default_branch }}
          # Git pathspecs; `:!` excludes the same two folders as the upload.
          add-paths: |
            droid-wiki/**
            :!droid-wiki/video/**
            :!droid-wiki/images/**
          commit-message: 'docs: refresh wiki'
          title: 'docs: refresh wiki'
          body: 'Generated by Droid Wiki Refresh. Review and merge to update droid-wiki/ on the default branch; the next refresh updates this pull request in place.'
          labels: droid-wiki

      - name: Report when the wiki could not be pushed
        if: steps.wiki-pr.outcome == 'failure'
        run: |
          echo "::warning::Could not push droid-wiki/ to $WIKI_BRANCH or open the pull request. The wiki was still generated (and uploaded when wiki cloud sync is on), but the next run has no previous wiki in the repository to start from. Check the branch rules on $WIKI_BRANCH and the contents/pull-requests permissions of the token."
