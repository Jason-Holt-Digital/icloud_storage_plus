name: Droid Wiki Refresh

# Factory's /install-wiki workflow, run weekly instead of on every push.
# Weeks with no code changes since the last generated wiki are skipped.
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

# The job that runs /wiki is read-only: the agent reads the whole repository
# and the pages restored from the unmerged rolling branch, so it must not be
# able to push or to open pull requests. The wiki-publish job below carries
# the write permissions.
permissions:
  contents: read

concurrency:
  group: droid-wiki-refresh
  cancel-in-progress: false

env:
  # Rolling branch that carries the generated wiki from one run to the next.
  WIKI_BRANCH: factory/droid-wiki

jobs:
  wiki-refresh:
    # Manual runs on other branches would publish unmerged documentation.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      generated: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history: /wiki diffs against the commit the previous wiki
          # was generated from to update only the affected pages.
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the previous wiki from the rolling branch
        # fetch-depth 0 already fetched every branch, so this needs no
        # credentials. The default branch's droid-wiki/ wins when it has wiki
        # commits the rolling branch lacks, such as page edits merged later.
        run: |
          rolling="origin/$WIKI_BRANCH"
          if ! git rev-parse -q --verify "$rolling" >/dev/null; then
            echo "No $WIKI_BRANCH branch; starting from droid-wiki/ on the default branch."
          elif [ -n "$(git log -1 --format=%H "$rolling..HEAD" -- droid-wiki)" ]; then
            echo "The default branch has wiki changes that $WIKI_BRANCH lacks; starting from droid-wiki/ on the default branch."
          else
            rm -rf droid-wiki
            git checkout "$rolling" -- droid-wiki
            echo "Restored droid-wiki/ from $WIKI_BRANCH."
          fi

      - name: Skip when no code changed since the last wiki
        id: changes
        run: |
          base=$(jq -r '.commitHash // empty' droid-wiki/.wiki-meta.json 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$base" ] ||
            ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null ||
            [ -n "$(git log -1 --format=%H "$base..HEAD" -- . ':!droid-wiki')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changes since the wiki was generated at $base; skipping the wiki refresh."
          fi

      - name: Install Factory Droid
        if: steps.changes.outputs.changed == 'true'
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Generate wiki
        if: steps.changes.outputs.changed == 'true'
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - name: Hand the wiki to the publish job
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droid-wiki
          # The pages and their metadata only: the video overview and the
          # screenshots stay out of git. The hidden .wiki-meta.json is what
          # makes the next refresh incremental.
          path: |
            droid-wiki
            !droid-wiki/video/**
            !droid-wiki/images/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  wiki-publish:
    needs: wiki-refresh
    if: needs.wiki-refresh.outputs.generated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Start from an empty folder so pages that /wiki removed stay removed.
      - name: Remove the default branch's wiki pages
        run: rm -rf droid-wiki

      - name: Pick up the generated wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: droid-wiki
          path: droid-wiki

      - name: Open or update the wiki pull request
        id: wiki-pr
        # The wiki is already generated and uploaded to Factory by this point,
        # so a rejected push or pull request must not fail the run.
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Pull requests opened with GITHUB_TOKEN do not trigger other
          # workflows, so CI and Droid review do not run on the wiki PR.
          token: ${{ github.token }}
          branch: ${{ env.WIKI_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            droid-wiki/**
            :!droid-wiki/video/**
            :!droid-wiki/images/**
          commit-message: 'docs: refresh wiki'
          title: 'docs: refresh wiki'
          body: 'Generated by Droid Wiki Refresh. Review and merge to update droid-wiki/ on the default branch; the next refresh updates this pull request in place.'
          labels: droid-wiki

      - name: Report when the wiki could not be pushed
        if: steps.wiki-pr.outcome == 'failure'
        run: |
          echo "::warning::Could not push droid-wiki/ to $WIKI_BRANCH or open the pull request. The wiki was still generated and uploaded to Factory. Check the branch rules on $WIKI_BRANCH and the contents/pull-requests permissions of the token."
